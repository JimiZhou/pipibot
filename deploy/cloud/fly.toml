app = "pipibot-cloud-brigade"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  HOME = "/data"
  PIPIBOT_HOST = "0.0.0.0"
  PIPIBOT_PORT = "4242"
  PIPIBOT_CHROME_PATH = "/usr/bin/chromium"

[mounts]
  source = "pipibot_cloud_data"
  destination = "/data"

[http_service]
  internal_port = 4242
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
